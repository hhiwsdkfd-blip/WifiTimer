          cat > wifitimer/app/src/main/java/com/example/wifitimer/TimerScheduler.kt <<'EOF'
          package com.example.wifitimer

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.provider.Settings

          object TimerScheduler {

              private fun pendingIntent(ctx: Context): PendingIntent =
                  PendingIntent.getBroadcast(
                      ctx,
                      0,
                      Intent(ctx, WifiOffReceiver::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

              fun start(ctx: Context, minutes: Int): Boolean {
                  val am = ctx.getSystemService(AlarmManager::class.java)

                  if (Build.VERSION.SDK_INT >= 31 && !am.canScheduleExactAlarms()) {
                      ctx.startActivity(
                          Intent(Settings.ACTION_REQUEST_SCHEDULE_EXACT_ALARM)
                              .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      )
                      return false
                  }

                  am.setExactAndAllowWhileIdle(
                      AlarmManager.RTC_WAKEUP,
                      System.currentTimeMillis() + minutes * 60_000L,
                      pendingIntent(ctx)
                  )
                  return true
              }

              fun cancel(ctx: Context) {
                  ctx.getSystemService(AlarmManager::class.java).cancel(pendingIntent(ctx))
              }
          }
          EOF

          cat > wifitimer/app/src/main/java/com/example/wifitimer/ShizukuWifi.kt <<'EOF'
          package com.example.wifitimer

          import android.content.pm.PackageManager
          import rikka.shizuku.Shizuku

          object ShizukuWifi {

              const val REQUEST_CODE = 1001

              fun isAvailable(): Boolean = try {
                  Shizuku.pingBinder()
              } catch (e: Throwable) {
                  false
              }

              fun hasPermission(): Boolean = try {
                  isAvailable() && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
              } catch (e: Throwable) {
                  false
              }

              fun requestPermission() {
                  try {
                      if (isAvailable() && !hasPermission()) Shizuku.requestPermission(REQUEST_CODE)
                  } catch (e: Throwable) {
                  }
              }

              fun disableWifi(): Boolean {
                  if (hasPermission() && runViaShizuku()) return true
                  return runViaRoot()
              }

              private fun runViaShizuku(): Boolean = try {
                  val method = Shizuku::class.java.getDeclaredMethod(
                      "newProcess",
                      Array<String>::class.java,
                      Array<String>::class.java,
                      String::class.java
                  )
                  method.isAccessible = true
                  val process = method.invoke(
                      null, arrayOf("sh", "-c", "svc wifi disable"), null, null
                  ) as Process
                  process.waitFor() == 0
              } catch (e: Throwable) {
                  false
              }

              private fun runViaRoot(): Boolean = try {
                  val p = Runtime.getRuntime().exec(arrayOf("su", "-c", "svc wifi disable"))
                  p.waitFor() == 0
              } catch (e: Throwable) {
                  false
              }
          }
          EOF

          cat > wifitimer/app/src/main/java/com/example/wifitimer/WifiOffReceiver.kt <<'EOF'
          package com.example.wifitimer

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.provider.Settings
          import androidx.core.app.NotificationCompat
          import androidx.core.app.NotificationManagerCompat
          import androidx.core.content.ContextCompat

          class WifiOffReceiver : BroadcastReceiver() {

              @Suppress("DEPRECATION")
              override fun onReceive(context: Context, intent: Intent) {
                  val pending = goAsync()
                  Thread {
                      try {
                          var ok = false
                          if (Build.VERSION.SDK_INT < 29) {
                              val wm = context.applicationContext
                                  .getSystemService(Context.WIFI_SERVICE) as WifiManager
                              ok = wm.setWifiEnabled(false)
                          }
                          if (!ok) ok = ShizukuWifi.disableWifi()
                          if (!ok) showNotification(context)
                      } finally {
                          pending.finish()
                      }
                  }.start()
              }

              @SuppressLint("MissingPermission")
              private fun showNotification(context: Context) {
                  val channelId = "wifi_timer_channel"

                  if (Build.VERSION.SDK_INT >= 26) {
                      val channel = NotificationChannel(
                          channelId, "Wifi Timer", NotificationManager.IMPORTANCE_HIGH
                      )
                      context.getSystemService(NotificationManager::class.java)
                          .createNotificationChannel(channel)
                  }

                  val target = if (Build.VERSION.SDK_INT >= 29) {
                      Intent(Settings.Panel.ACTION_INTERNET_CONNECTIVITY)
                  } else {
                      Intent(Settings.ACTION_WIFI_SETTINGS)
                  }.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)

                  val pi = PendingIntent.getActivity(
                      context, 1, target, PendingIntent.FLAG_IMMUTABLE
                  )

                  val notification = NotificationCompat.Builder(context, channelId)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle("ط§ظ†طھظ‡ظ‰ ط§ظ„ظ…ط¤ظ‚طھ")
                      .setContentText("ط§ط¶ط؛ط· ظ„ط¥ط·ظپط§ط، ط§ظ„ظˆط§ظٹ ظپط§ظٹ")
                      .setPriority(NotificationCompat.PRIORITY_HIGH)
                      .setContentIntent(pi)
                      .setAutoCancel(true)
                      .build()

                  val granted = Build.VERSION.SDK_INT < 33 ||
                      ContextCompat.checkSelfPermission(
                          context, Manifest.permission.POST_NOTIFICATIONS
                      ) == PackageManager.PERMISSION_GRANTED

                  if (granted) {
                      NotificationManagerCompat.from(context).notify(100, notification)
                  }
              }
          }
          EOF

